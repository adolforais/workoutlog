<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adolfo's Workout Log</title>
  <link rel="stylesheet" href="style.css">
  <script src="workout_program.js"></script>
</head>
<body>
  <div id="siteNav"></div>
  <div class="wrap wide">
    <header class="page">
      <h1>Adolfo's workout log</h1>
      <p class="sub">Pick a week and day, log today's sets, and review past sessions below.</p>
    </header>

    <div class="card">
      <form id="logForm">
        <div class="field-row">
          <div class="field-inline">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
          <div class="field-inline">
            <label for="week">Week</label>
            <select id="week" required>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="3">3</option>
              <option value="4">4</option>
            </select>
          </div>
          <div class="field-inline">
            <label for="day">Day</label>
            <select id="day" required></select>
          </div>
          <button type="button" class="btn" onclick="generateTable()">Show Exercises</button>
        </div>
      </form>
      <div id="session"></div>
    </div>

    <div class="section-head">
      <h2>Session Log</h2>
      <a href="analysis.html" class="btn secondary">View Performance Analysis &rarr;</a>
    </div>

    <div class="card">
      <div class="calendar-header">
        <button type="button" class="btn secondary" onclick="changeMonth(-1)">&larr;</button>
        <h3 id="calendarLabel"></h3>
        <button type="button" class="btn secondary" onclick="changeMonth(1)">&rarr;</button>
      </div>
      <div id="calendarGrid"></div>
      <div class="calendar-legend small">
        <span class="day-badge day-push">Ps</span> Push
        <span class="day-badge day-pull">Pl</span> Pull
        <span class="day-badge day-lower">Lo</span> Lower
      </div>
    </div>

    <div id="dayDetail"></div>

    <div style="margin-top: 16px;">
      <button onclick="clearLog()" class="btn danger">Clear All Logs</button>
      <button onclick="exportJSON()" class="btn secondary">Export Log (JSON)</button>
      <button onclick="importJSON()" class="btn secondary">Import Log (JSON)</button>
      <input type="file" id="importFile" class="hidden" accept=".json" onchange="handleFileImport(event)" />
    </div>

    <footer class="page">
      Logs are stored locally in this browser. Export regularly if you want a backup.
    </footer>
  </div>

  <script src="nav.js"></script>
  <script>
    let currentSessionIndex = null;

    function findExistingSession(date, day) {
      const allLogs = getLogs();
      let match = null;
      allLogs.forEach((log, index) => {
        if (log.date === date && log.day === day) match = { log, index };
      });
      return match;
    }

    function renderDayOptions() {
      const daySelect = document.getElementById('day');
      daySelect.innerHTML = '';
      for (const key in programDays) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = programDays[key];
        daySelect.appendChild(opt);
      }
    }

    function generateTable() {
      const dateInput = document.getElementById('date');
      if (!dateInput.value) {
        dateInput.value = todayISO();
      }

      const date = dateInput.value;
      const day = document.getElementById('day').value;
      const existing = findExistingSession(date, day);

      if (existing) {
        document.getElementById('week').value = existing.log.week;
        currentSessionIndex = existing.index;
      } else {
        currentSessionIndex = null;
      }

      const week = parseInt(document.getElementById('week').value) - 1;
      const sessionDiv = document.getElementById('session');
      const exercises = program[day];
      const savedExercises = existing ? existing.log.log : null;

      let html = `<h3>${document.getElementById('day').options[document.getElementById('day').selectedIndex].text} - Week ${
        week + 1
      }</h3>`;
      if (existing) {
        html += `<p class="small">Resumed from a previously saved session for this date &amp; day.</p>`;
      }
      html += `<form id='sessionForm' onsubmit='saveSession(event)'>`;
      html += `<div class="table-scroll"><table><tr><th>Exercise</th><th>Weight</th>`;

      let maxSets = Math.max(...exercises.map((e) => e.sets[week]));
      for (let s = 1; s <= maxSets; ++s)
        html += `<th>Set ${s} reps<br><span class='small'>(target)</span></th>`;
      html += `</tr>`;

      exercises.forEach((ex) => {
        const savedEx = savedExercises ? savedExercises.find((x) => x.name === ex.name) : null;
        const savedWeight = savedEx && savedEx.weight !== '0' ? savedEx.weight : '';
        html += `<tr><td>${ex.name}<br><span class='small'>${ex.sets[week]} × ${ex.reps[week]}</span></td>`;
        html += `<td><input type='number' min='0' max='999' step='any' name='w_${ex.name}' placeholder='kg' value='${savedWeight}' class='qty-input'></td>`;
        for (let s = 0; s < ex.sets[week]; ++s) {
          const savedRep = savedEx && savedEx.reps[s] !== undefined && savedEx.reps[s] !== '0' ? savedEx.reps[s] : '';
          html += `<td><input type='number' min='0' max='99' name='r_${ex.name}_${s + 1}' placeholder='Reps' value='${savedRep}' class='qty-input'></td>`;
        }
        for (let s = ex.sets[week]; s < maxSets; ++s) html += `<td class='hidden'></td>`;
        html += `</tr>`;
      });
      html += `</table></div><br>`;
      html += `<button type='submit' class='btn'>Save Progress</button> <span id='saveStatus' class='small'></span></form>`;
      sessionDiv.innerHTML = html;
    }

    function saveSession(event) {
      event.preventDefault();
      const date = document.getElementById('date').value;
      const week = document.getElementById('week').value;
      const day = document.getElementById('day').value;
      const form = document.getElementById('sessionForm');
      const exercises = program[day];
      let entry = { date, week, day, log: [] };
      exercises.forEach((ex) => {
        let exObj = { name: ex.name, weight: form[`w_${ex.name}`].value || '0', reps: [] };
        for (let s = 1; s <= ex.sets[week - 1]; ++s) {
          exObj.reps.push(form[`r_${ex.name}_${s}`].value || '0');
        }
        entry.log.push(exObj);
      });
      let allLogs = getLogs();
      if (currentSessionIndex !== null && allLogs[currentSessionIndex]) {
        allLogs[currentSessionIndex] = entry;
      } else {
        allLogs.push(entry);
        currentSessionIndex = allLogs.length - 1;
      }
      saveLogs(allLogs);
      const status = document.getElementById('saveStatus');
      if (status) status.textContent = `Saved at ${new Date().toLocaleTimeString()}`;

      calendarViewDate = parseLocalDate(date);
      selectedDayDate = date;
      refreshLogViews();
    }

    let calendarViewDate = new Date();
    let selectedDayDate = null;

    function pad2(n) {
      return String(n).padStart(2, '0');
    }

    function dayTypeCode(day) {
      const label = programDays[day] || day;
      const words = label.split(' ');
      const prefixes = { push: 'Ps', pull: 'Pl', lower: 'Lo' };
      const prefix = prefixes[words[0].toLowerCase()] || words[0].slice(0, 2);
      return words.length > 1 ? prefix + words[1][0] : label.slice(0, 3);
    }

    function dayTypeColorClass(day) {
      const label = (programDays[day] || day).toLowerCase();
      if (label.startsWith('push')) return 'day-push';
      if (label.startsWith('pull')) return 'day-pull';
      if (label.startsWith('lower')) return 'day-lower';
      return '';
    }

    function changeMonth(delta) {
      calendarViewDate = new Date(calendarViewDate.getFullYear(), calendarViewDate.getMonth() + delta, 1);
      renderCalendar();
    }

    function selectDay(dateStr) {
      selectedDayDate = selectedDayDate === dateStr ? null : dateStr;
      renderCalendar();
      renderDayDetail();
    }

    function refreshLogViews() {
      renderCalendar();
      renderDayDetail();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const label = document.getElementById('calendarLabel');
      const year = calendarViewDate.getFullYear();
      const month = calendarViewDate.getMonth();
      label.textContent = calendarViewDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

      const allLogs = getLogs();
      const logsByDate = {};
      allLogs.forEach((log) => {
        if (!logsByDate[log.date]) logsByDate[log.date] = [];
        logsByDate[log.date].push(log);
      });

      const firstOfMonth = new Date(year, month, 1);
      const startOffset = firstOfMonth.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = todayISO();

      let html = `<div class="calendar-weekdays">${['S', 'M', 'T', 'W', 'T', 'F', 'S']
        .map((d) => `<div>${d}</div>`)
        .join('')}</div>`;
      html += `<div class="calendar-days">`;
      for (let i = 0; i < startOffset; ++i) html += `<div class="calendar-day empty"></div>`;
      for (let d = 1; d <= daysInMonth; ++d) {
        const dateStr = `${year}-${pad2(month + 1)}-${pad2(d)}`;
        const sessions = logsByDate[dateStr];
        let classes = 'calendar-day';
        if (dateStr === todayStr) classes += ' today';
        if (sessions) classes += ' has-session';
        if (dateStr === selectedDayDate) classes += ' selected';
        html += `<div class="${classes}" ${sessions ? `onclick="selectDay('${dateStr}')"` : ''}>`;
        html += `<span class="day-num">${d}</span>`;
        if (sessions) {
          html += `<div class="day-badges">`;
          sessions.slice(0, 2).forEach((s) => {
            html += `<span class="day-badge ${dayTypeColorClass(s.day)}">${dayTypeCode(s.day)}</span>`;
          });
          if (sessions.length > 2) html += `<span class="day-badge">+${sessions.length - 2}</span>`;
          html += `</div>`;
        }
        html += `</div>`;
      }
      html += `</div>`;
      grid.innerHTML = html;
    }

    function renderDayDetail() {
      const el = document.getElementById('dayDetail');
      if (!selectedDayDate) {
        el.innerHTML = '';
        return;
      }
      const allLogs = getLogs();
      const sessions = allLogs.filter((log) => log.date === selectedDayDate);
      if (!sessions.length) {
        el.innerHTML = '';
        return;
      }

      const dateLabel = parseLocalDate(selectedDayDate).toLocaleDateString(undefined, {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric',
      });

      let html = `<div class="card">`;
      html += `<div class="section-head" style="margin-top: 0;"><h3 style="margin: 0;">${dateLabel}</h3><button type="button" class="btn secondary" onclick="selectDay('${selectedDayDate}')">Close</button></div>`;

      sessions.forEach((e) => {
        html += `<div style="font-weight: 600; margin: 14px 0 8px;">Week ${e.week} | ${programDays[e.day] || e.day}</div>`;
        html += `<div class="table-scroll"><table><tr><th>Exercise</th><th>Weight</th>`;

        let maxSets = maxSetsLogged(e);
        for (let i = 1; i <= maxSets; ++i) html += `<th>Set ${i} reps</th>`;
        html += `</tr>`;

        e.log.forEach((ex) => {
          html += `<tr><td>${ex.name}</td><td>${ex.weight}</td>`;
          ex.reps.forEach((r) => (html += `<td>${r}</td>`));
          for (let s = ex.reps.length; s < maxSets; ++s) html += `<td></td>`;
          html += `</tr>`;
        });
        html += `</table></div>`;
      });

      html += `</div>`;
      el.innerHTML = html;
    }

    function clearLog() {
      if (confirm('Clear ALL logs?')) {
        clearLogs();
        selectedDayDate = null;
        refreshLogViews();
      }
    }

    function exportJSON() {
      let allLogs = localStorage.getItem(LOGS_KEY);
      if (!allLogs) {
        alert('No sessions to export!');
        return;
      }
      let logsArray = JSON.parse(allLogs);
      if (!Array.isArray(logsArray) || logsArray.length === 0) {
        alert('No sessions to export!');
        return;
      }
      let lastSession = logsArray[logsArray.length - 1];
      let lastDate = lastSession.date || 'session';
      let safeDate = lastDate.replace(/[^0-9\-]/g, '');
      let filename = `log_${safeDate}.json`;

      let blob = new Blob([allLogs], { type: 'application/json' });
      let url = URL.createObjectURL(blob);
      let a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importJSON() {
      document.getElementById('importFile').click();
    }
    function handleFileImport(event) {
      let file = event.target.files[0];
      if (!file) return;
      let reader = new FileReader();
      reader.onload = function (e) {
        try {
          let logs = JSON.parse(e.target.result);
          if (!Array.isArray(logs)) throw 'Invalid format';
          if (!confirm('Overwrite your current log with the imported file?')) return;
          saveLogs(logs);
          selectedDayDate = null;
          refreshLogViews();
          alert('Log imported!');
        } catch {
          alert('Invalid file or format.');
        }
      };
      reader.readAsText(file);
    }

    document.addEventListener('DOMContentLoaded', function () {
      renderDayOptions();
      refreshLogViews();
    });
  </script>
</body>
</html>
